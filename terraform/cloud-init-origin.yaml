#cloud-config
# Cloud-init for the demo.datum.net ORIGIN box.
#
# Ships three things:
# 1. `demo origin --listen :8080` as systemd unit demo-origin.service (enabled)
# 2. `datum-connect tunnel listen` as systemd unit datum-connect.service (disabled)
# 3. `datumctl` available on PATH for ad-hoc inspection
#
# Both services run as root. datumctl reads its session from $HOME/.datumctl,
# so a single `datumctl login` on the box just works. Datum-connect state
# (the repo it materialises) lives under /var/lib/demo; root-owned datumctl
# state (session + keyring JSON) lives under /root.
#
# Binaries are scp'd by ../deploy.sh after the box is up. demo-origin starts
# as soon as the binary lands. datum-connect.service waits until you SSH in
# and authenticate — see the "FINISH SETUP" steps at the bottom.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnome-keyring
  - libsecret-1-0
  - dbus-user-session
%{ if enable_caddy ~}
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - gnupg
%{ endif ~}

write_files:
  # ----------------------------------------------------------------
  # demo-origin.service — the fixed-JSON origin
  # ----------------------------------------------------------------
  - path: /etc/systemd/system/demo-origin.service
    permissions: '0644'
    content: |
      [Unit]
      Description=demo.datum.net sample origin
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/demo origin --listen :8080 --payload-bytes ${payload_bytes}
      Restart=on-failure
      RestartSec=2s
      WorkingDirectory=/var/lib/demo
      StateDirectory=demo

      NoNewPrivileges=true
      ProtectSystem=strict
      PrivateTmp=true

      [Install]
      WantedBy=multi-user.target

  # ----------------------------------------------------------------
  # datum-connect.service — disabled by default, enable manually
  # after authenticating. Reads state from /var/lib/demo (via HOME).
  # ----------------------------------------------------------------
  - path: /etc/systemd/system/datum-connect.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Datum Connect tunnel listener (exposes :8080 origin to Datum gateway)
      After=network-online.target demo-origin.service
      Wants=network-online.target
      Requires=demo-origin.service

      [Service]
      Type=simple
      WorkingDirectory=/var/lib/demo
      Environment=DATUM_CONNECT_REPO=/var/lib/demo/datum-connect
      # datumctl needs a non-D-Bus keyring on a headless box; this env var
      # makes it persist tokens in a JSON file instead of org.freedesktop.secrets.
      Environment=DATUMCTL_KEYRING_FILE=/root/.datumctl-keyring.json
      ExecStart=/usr/local/bin/datum-connect tunnel listen \
        --endpoint 127.0.0.1:8080 \
        --label demo-origin \
        --yes
      Restart=on-failure
      RestartSec=10s

      ReadWritePaths=/var/lib/demo

      [Install]
      WantedBy=multi-user.target

  # ----------------------------------------------------------------
  # Thin wrappers that set the same env the systemd unit uses so manual
  # invocations from a root shell see the same state. Running as root,
  # so no sudo.
  # ----------------------------------------------------------------
  - path: /usr/local/bin/datum-auth
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      exec env \
        DATUM_CONNECT_REPO=/var/lib/demo/datum-connect \
        DATUMCTL_KEYRING_FILE=/root/.datumctl-keyring.json \
        /usr/local/bin/datum-connect "$@"

  - path: /usr/local/bin/datumctl-auth
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      exec env \
        DATUMCTL_KEYRING_FILE=/root/.datumctl-keyring.json \
        /usr/local/bin/datumctl "$@"

%{ if enable_caddy ~}
  # ----------------------------------------------------------------
  # Caddy reverse-proxies the origin on :443 with Let's Encrypt so
  # the prober's "direct" probe can negotiate HTTP/2 over TLS. Demo
  # origin still listens plaintext on 127.0.0.1:8080.
  # ----------------------------------------------------------------
  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    content: |
      ${hostname} {
        encode zstd gzip
        reverse_proxy 127.0.0.1:8080
        log {
          output stdout
          format console
        }
      }

      :80 {
        redir https://${hostname}{uri} permanent
      }
%{ endif ~}

runcmd:
  - install -d -m 0755 /var/lib/demo
  - install -d -m 0755 /var/lib/demo/datum-connect
  - systemctl daemon-reload
  - systemctl enable demo-origin.service
  # datum-connect.service is intentionally NOT enabled — see FINISH SETUP.
%{ if enable_caddy ~}
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy
  - getent group  caddy >/dev/null || groupadd --system caddy
  - getent passwd caddy >/dev/null || useradd --system --no-create-home --home-dir /var/lib/caddy --shell /usr/sbin/nologin --gid caddy caddy
  - install -d -m 0750 -o caddy -g caddy /var/lib/caddy
  - systemctl enable --now caddy
%{ endif ~}

final_message: |
  Origin box ready. To finish:

    # On your laptop, ship the binaries:
    ./deploy.sh                       # ships demo, datumctl, datum-connect

    # Then SSH in (as root) and authenticate. The wrappers set
    # DATUMCTL_KEYRING_FILE so datumctl persists tokens to a JSON file
    # instead of needing org.freedesktop.secrets on this headless box.
    ssh root@<this-box-ip>
    datumctl-auth auth login              # browser device-code flow
    datum-auth projects                   # pick the project
    datum-auth tunnel list                # sanity check

    # When ready, enable the tunnel service:
    systemctl enable --now datum-connect.service
    systemctl status datum-connect.service
