#cloud-config
# Cloud-init for the demo.datum.net prober box.
#
# - Drops a systemd unit that runs `/usr/local/bin/demo prober` as root.
#   /var/lib/demo (sqlite db) is provisioned via StateDirectory=.
#   We run as root deliberately: datumctl's exec credential plugin reads
#   its session from $HOME/.datumctl, and running as root keeps $HOME at
#   /root so a single `datumctl login` on the box just works.
# - The binary itself is NOT installed here — scp it via ../deploy.sh
#   after the box comes up, then `systemctl start demo-prober`.
# - If a public hostname was passed in, installs Caddy and points it at the
#   prober on :8080 with auto-Let's-Encrypt.

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
%{ if enable_caddy ~}
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - gnupg
%{ endif ~}

write_files:
  - path: /etc/systemd/system/demo-prober.service
    permissions: '0644'
    content: |
      [Unit]
      Description=demo.datum.net split-path prober
      Documentation=https://github.com/datum-cloud
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      # Runs as root. $HOME is /root, so datumctl's exec credential plugin
      # finds its session at /root/.datumctl (the same place a one-shot
      # `datumctl login` on this box writes to).
      ExecStart=/usr/local/bin/demo prober \
        --listen 127.0.0.1:8080 \
        --target-direct ${target_direct} \
        --target-datum ${target_datum} \
        --db /var/lib/demo/prober.db \
        --interval 5s \
        --debug%{ if enable_datum_control } \
        --datum-kubeconfig /var/lib/demo/kubeconfig.yaml \
        --datum-tunnel-namespace ${datum_tunnel_namespace} \
        --datum-tunnel-name ${datum_tunnel_name}%{ endif }
      Restart=on-failure
      RestartSec=2s
      WorkingDirectory=/var/lib/demo
      StateDirectory=demo
      StateDirectoryMode=0750

      # Hardening. ProtectHome is intentionally omitted — datumctl reads its
      # session out of /root/.datumctl, which ProtectHome=true would mask.
      NoNewPrivileges=true
      ProtectSystem=strict
      PrivateTmp=true
      ReadWritePaths=/var/lib/demo

      [Install]
      WantedBy=multi-user.target

%{ if enable_caddy ~}
  - path: /etc/caddy/Caddyfile
    permissions: '0644'
    content: |
      ${hostname} {
        encode zstd gzip
        reverse_proxy 127.0.0.1:8080
        log {
          output stdout
          format console
        }
      }

      # Plain-IP requests get redirected to the canonical hostname.
      :80 {
        redir https://${hostname}{uri} permanent
      }
%{ endif ~}

runcmd:
  - systemctl daemon-reload
  - systemctl enable demo-prober.service
%{ if enable_caddy ~}
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy
  # The Caddy package's postinst is supposed to add the caddy user/group,
  # but in cloud-init it sometimes doesn't run to completion. Belt-and-braces.
  - getent group  caddy >/dev/null || groupadd --system caddy
  - getent passwd caddy >/dev/null || useradd --system --no-create-home --home-dir /var/lib/caddy --shell /usr/sbin/nologin --gid caddy caddy
  - install -d -m 0750 -o caddy -g caddy /var/lib/caddy
  - systemctl enable --now caddy
%{ endif ~}

final_message: |
  Prober box ready. The systemd unit demo-prober is enabled but not running
  yet because /usr/local/bin/demo doesn't exist. To finish:

    # from your laptop, in the repo root
    ./deploy.sh root@<this-box-ip>

  That builds the binary with nix and starts the service.

%{ if enable_datum_control ~}
  The unit is wired with --datum-kubeconfig, so the With-Datum 'Basic auth'
  toggle expects two extra artefacts (run these as root on this box):

    1. Log datumctl in (writes its session to /root/.datumctl/):

         datumctl login --credentials /path/to/sa.json \
           --hostname auth.datum.net
         datumctl auth list   # verify

    2. Generate the kubeconfig the prober will consume:

         datumctl auth update-kubeconfig --project <project> \
           --hostname api.datum.net \
           --kubeconfig /var/lib/demo/kubeconfig.yaml

       The --hostname flag is required — without it datumctl emits a buggy
       'https://https://...' server URL.

  Once both are in place: systemctl restart demo-prober.service.
%{ endif ~}
